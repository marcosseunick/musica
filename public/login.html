<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Entrar | Harmonia</title>
  <meta name="description" content="Acesse sua conta na plataforma Harmonia e continue seus estudos musicais." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/tailwind.config.js"></script>
  <link rel="stylesheet" href="css/app.css" />
  <script>
    if (localStorage.getItem('token')) window.location.replace('/dashboard.html');
  </script>
</head>
<body class="font-sans text-zinc-300 antialiased relative min-h-screen flex flex-col justify-center px-4 py-12 sm:px-6 lg:px-8">
  <div class="aurora" aria-hidden="true"></div>

  <div class="sm:mx-auto sm:w-full sm:max-w-md text-center">
    <a href="index.html" class="inline-flex items-center gap-2.5 text-white focus:outline-none">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" class="h-8 w-8 text-amber-400"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
      <span class="font-display text-3xl font-extrabold tracking-tight">Harmonia</span>
    </a>
    <h1 class="mt-6 font-display text-2xl font-bold tracking-tight text-white">Bem-vindo de volta</h1>
    <p class="mt-2 text-sm text-zinc-400">Continue seus estudos no seu próprio ritmo.</p>
  </div>

  <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-[440px]">
    <div class="card p-6 sm:p-8 shadow-2xl">
      <form class="space-y-5" id="login-form">
        <div id="error-message" class="hidden alert alert-error" role="alert">
          <div class="flex items-center gap-2">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="h-4 w-4 shrink-0"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6M9 9l6 6"/></svg>
            <span id="error-text">E-mail ou senha incorretos</span>
          </div>
        </div>

        <div>
          <label for="email" class="field-label">Endereço de e-mail</label>
          <input id="email" name="email" type="email" autocomplete="email" required placeholder="seu@email.com" class="field" />
        </div>

        <div>
          <div class="flex items-center justify-between">
            <label for="password" class="field-label">Senha</label>
          </div>
          <div class="password-wrap">
            <input id="password" name="password" type="password" autocomplete="current-password" required placeholder="••••••••" class="field" />
            <button type="button" class="password-toggle" data-target="password" aria-label="Ver senha">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="h-4 w-4"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-block py-3 mt-2 text-base">
          <span>Entrar na plataforma</span>
        </button>
      </form>

      <div class="mt-8 pt-6 border-t border-zinc-800/80 text-center text-sm text-zinc-400">
        Ainda não tem conta?
        <a href="register.html" class="font-semibold text-amber-400 hover:text-amber-300 transition-colors ml-1">Criar conta gratuita</a>
      </div>
    </div>
  </div>

  <script src="js/common.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>

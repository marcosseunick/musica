<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | Harmonia</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/tailwind.config.js"></script>
  <link rel="stylesheet" href="css/app.css" />
</head>
<body class="font-sans text-zinc-300 antialiased bg-zinc-950 flex min-h-screen flex-col justify-center py-12 sm:px-6 lg:px-8">
  <div class="sm:mx-auto sm:w-full sm:max-w-md">
    <a href="index.html" class="flex justify-center items-center gap-2 text-white">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" class="h-8 w-8"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
      <span class="font-display text-3xl font-bold tracking-tight">Harmonia</span>
    </a>
    <h2 class="mt-6 text-center font-display text-2xl font-bold leading-9 tracking-tight text-white">Entre na sua conta</h2>
  </div>

  <div class="mt-10 sm:mx-auto sm:w-full sm:max-w-[480px]">
    <div class="bg-zinc-900 border border-zinc-800 px-6 py-12 shadow-sm sm:rounded-xl sm:px-12">
      <form class="space-y-6" id="login-form">
        <div id="error-message" class="hidden rounded-md bg-red-500/10 border border-red-500/20 p-4">
          <div class="flex">
            <div class="ml-3">
              <h3 class="text-sm font-medium text-red-400" id="error-text">E-mail ou senha incorretos</h3>
            </div>
          </div>
        </div>

        <div>
          <label for="email" class="block text-sm font-medium leading-6 text-zinc-100">Endereço de e-mail</label>
          <div class="mt-2">
            <input id="email" name="email" type="email" autocomplete="email" required class="block w-full rounded-md border-0 bg-zinc-800/50 py-1.5 text-white shadow-sm ring-1 ring-inset ring-zinc-700 focus:ring-2 focus:ring-inset focus:ring-zinc-300 sm:text-sm sm:leading-6">
          </div>
        </div>

        <div>
          <label for="password" class="block text-sm font-medium leading-6 text-zinc-100">Senha</label>
          <div class="mt-2">
            <input id="password" name="password" type="password" autocomplete="current-password" required class="block w-full rounded-md border-0 bg-zinc-800/50 py-1.5 text-white shadow-sm ring-1 ring-inset ring-zinc-700 focus:ring-2 focus:ring-inset focus:ring-zinc-300 sm:text-sm sm:leading-6">
          </div>
        </div>

        <div>
          <button type="submit" class="flex w-full justify-center rounded-md bg-zinc-100 px-3 py-2 text-sm font-semibold text-zinc-900 shadow-sm hover:bg-zinc-300 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-zinc-100 transition-colors">
            Entrar
          </button>
        </div>
      </form>

      <p class="mt-10 text-center text-sm text-zinc-400">
        Ainda não tem conta?
        <a href="register.html" class="font-semibold leading-6 text-white hover:text-zinc-300 transition-colors">Cadastre-se grátis</a>
      </p>
    </div>
  </div>

  <script src="js/auth.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Harmonia | Cursos de Música</title>
  <meta name="description" content="Aprenda músicas no seu instrumento com aulas em vídeo." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/tailwind.config.js"></script>
  <link rel="stylesheet" href="css/app.css" />
</head>
<body class="font-sans text-zinc-300 antialiased bg-zinc-950">
  <header class="border-b border-zinc-800 bg-zinc-950/90 backdrop-blur-md sticky top-0 z-40">
    <div class="mx-auto flex h-16 max-w-7xl items-center justify-between px-4 sm:px-6 lg:px-8">
      <a href="index.html" class="flex items-center gap-2">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" class="h-6 w-6 text-white"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
        <span class="font-display text-xl font-bold tracking-tight text-white">Harmonia</span>
      </a>
      <div class="flex items-center gap-4">
        <a href="login.html" class="text-sm font-medium text-zinc-300 hover:text-white transition-colors">Entrar</a>
        <a href="register.html" class="rounded-md bg-zinc-100 px-4 py-2 text-sm font-semibold text-zinc-900 transition-colors hover:bg-zinc-300 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-zinc-100">Cadastre-se</a>
      </div>
    </div>
  </header>

  <main>
    <section class="relative px-4 pt-24 pb-32 sm:px-6 lg:px-8 overflow-hidden flex items-center justify-center">
      <!-- Fundo escuro e simples com a imagem desfocada apenas como textura -->
      <img src="assets/hero.jpg" alt="Fundo" class="absolute inset-0 -z-10 h-full w-full object-cover opacity-20 filter grayscale" />
      <div class="absolute inset-0 -z-10 bg-gradient-to-b from-zinc-950 via-zinc-950/80 to-zinc-950"></div>

      <div class="mx-auto max-w-2xl text-center animate-fade-up">
        <h1 class="font-display text-4xl font-bold tracking-tight text-white sm:text-6xl">
          Toque a música que você ama, no seu nível.
        </h1>
        <p class="mt-6 text-lg leading-8 text-zinc-400">
          Aprenda o seu instrumento com uma progressão didática de verdade. Comece pelo básico e avance no arranjo sem trocar de música.
        </p>
        <div class="mt-10 flex items-center justify-center gap-x-6">
          <a href="register.html" class="rounded-md bg-zinc-100 px-5 py-3 text-sm font-semibold text-zinc-900 transition-colors hover:bg-zinc-300 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-zinc-100">
            Começar a aprender
          </a>
          <a href="login.html" class="text-sm font-semibold leading-6 text-white hover:text-zinc-300 transition-colors">
            Já tem uma conta? Entrar <span aria-hidden="true">→</span>
          </a>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
